<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1480" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B132B"/>
      <stop offset="0.5" stop-color="#12355B"/>
      <stop offset="1" stop-color="#1E6F5C"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1D2939"/>
      <stop offset="1" stop-color="#101828"/>
    </linearGradient>
    <linearGradient id="card" x1="220" y1="170" x2="1330" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="wall1" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FDE68A"/>
      <stop offset="0.55" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="wall2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="blur" x="-200" y="-200" width="2000" height="1400" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <filter id="shadow" x="170" y="100" width="1280" height="700" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#04111D" flood-opacity="0.42"/>
    </filter>
    <filter id="soft" x="0" y="0" width="1600" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#09111F" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>

  <g filter="url(#blur)" opacity="0.55">
    <circle cx="260" cy="170" r="140" fill="#F59E0B"/>
    <circle cx="1230" cy="210" r="190" fill="#38BDF8"/>
    <circle cx="1240" cy="720" r="180" fill="#A855F7"/>
    <circle cx="360" cy="760" r="200" fill="#10B981"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="210" y="140" width="1180" height="620" rx="30" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <rect x="210" y="140" width="1180" height="54" rx="30" fill="url(#panel)"/>
    <circle cx="246" cy="167" r="6" fill="#FF5F57"/>
    <circle cx="268" cy="167" r="6" fill="#FEBC2E"/>
    <circle cx="290" cy="167" r="6" fill="#28C840"/>
    <text x="320" y="174" fill="#E5EEF8" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="600">Wallpaper Slideshow</text>

    <rect x="255" y="235" width="620" height="420" rx="24" fill="#0F172A" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="735" y="255" width="180" height="100" rx="18" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="945" y="255" width="180" height="100" rx="18" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="1155" y="255" width="180" height="100" rx="18" fill="#FFFFFF" fill-opacity="0.08"/>

    <rect x="255" y="235" width="620" height="420" rx="24" fill="url(#wall1)"/>
    <path d="M255 520C340 450 420 415 520 428C620 441 665 520 730 545C786 566 829 553 875 520V655H255V520Z" fill="#0F172A" fill-opacity="0.28"/>
    <path d="M255 575C320 535 388 520 460 537C526 553 580 604 664 607C738 610 813 574 875 525V655H255V575Z" fill="#FFFFFF" fill-opacity="0.14"/>

    <rect x="925" y="395" width="410" height="260" rx="24" fill="#111827" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="958" y="435" fill="#E5EEF8" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="26" font-weight="700">Fade into the next frame</text>
    <text x="958" y="470" fill="#C8D4E3" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18">Smooth animated transitions with folder-based rotation,</text>
    <text x="958" y="498" fill="#C8D4E3" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18">top-bar controls, shuffle mode, and adjustable timing.</text>

    <rect x="958" y="545" width="126" height="42" rx="21" fill="#38BDF8"/>
    <text x="989" y="571" fill="#082F49" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="17" font-weight="700">GNOME 45-49</text>
    <rect x="1098" y="545" width="103" height="42" rx="21" fill="#F59E0B"/>
    <text x="1132" y="571" fill="#4A2200" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="17" font-weight="700">GJS</text>
    <rect x="1215" y="545" width="88" height="42" rx="21" fill="#10B981"/>
    <text x="1240" y="571" fill="#042F1E" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="17" font-weight="700">MIT</text>
  </g>

  <g filter="url(#soft)">
    <rect x="1085" y="96" width="258" height="64" rx="24" fill="#0B1220" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="1131" cy="128" r="12" fill="#38BDF8"/>
    <rect x="1156" y="116" width="155" height="10" rx="5" fill="#E5EEF8" fill-opacity="0.9"/>
    <rect x="1156" y="133" width="108" height="8" rx="4" fill="#C8D4E3" fill-opacity="0.72"/>
  </g>

  <text x="210" y="96" fill="#F8FAFC" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="54" font-weight="800">Wallpaper Slideshow</text>
  <text x="210" y="118" fill="#C8D4E3" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="24">Animated wallpaper rotation for GNOME Shell, designed to feel native.</text>
</svg>
