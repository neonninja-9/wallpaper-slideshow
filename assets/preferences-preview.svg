<svg width="1400" height="840" viewBox="0 0 1400 840" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EAF2FF"/>
      <stop offset="1" stop-color="#D8F3DC"/>
    </linearGradient>
    <linearGradient id="sidebar" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="preview" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FDE68A"/>
      <stop offset="0.5" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="shadow" x="90" y="60" width="1220" height="700" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#64748B" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1400" height="840" rx="28" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="120" y="90" width="1160" height="660" rx="30" fill="#FFFFFF"/>
    <rect x="120" y="90" width="300" height="660" rx="30" fill="url(#sidebar)"/>
    <rect x="120" y="90" width="300" height="60" rx="30" fill="#F1F5F9"/>

    <text x="158" y="128" fill="#0F172A" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="24" font-weight="700">Wallpaper Slideshow</text>

    <rect x="148" y="180" width="244" height="58" rx="18" fill="#DBEAFE"/>
    <rect x="148" y="252" width="244" height="58" rx="18" fill="#FFFFFF"/>
    <rect x="148" y="324" width="244" height="58" rx="18" fill="#FFFFFF"/>

    <g font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="20" font-weight="600">
      <text x="186" y="216" fill="#1D4ED8">General</text>
      <text x="186" y="288" fill="#475569">Transition</text>
      <text x="186" y="360" fill="#475569">About</text>
    </g>

    <text x="468" y="154" fill="#0F172A" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="34" font-weight="800">Preferences</text>
    <text x="468" y="190" fill="#475569" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18">Choose a wallpaper folder, tune timing, and control transitions.</text>

    <rect x="468" y="232" width="764" height="176" rx="24" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="500" y="272" fill="#0F172A" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="24" font-weight="700">Current Wallpaper</text>
    <rect x="500" y="294" width="280" height="86" rx="18" fill="url(#preview)"/>
    <text x="808" y="322" fill="#475569" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18">Wallpaper Folder</text>
    <rect x="808" y="337" width="260" height="18" rx="9" fill="#CBD5E1"/>
    <rect x="1084" y="326" width="116" height="42" rx="16" fill="#0EA5E9"/>
    <text x="1116" y="353" fill="#082F49" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="700">Choose</text>

    <rect x="468" y="434" width="764" height="252" rx="24" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="500" y="474" fill="#0F172A" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="24" font-weight="700">Playback</text>

    <text x="500" y="522" fill="#475569" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18">Change Interval</text>
    <rect x="500" y="538" width="520" height="12" rx="6" fill="#CBD5E1"/>
    <rect x="500" y="538" width="258" height="12" rx="6" fill="#0EA5E9"/>
    <rect x="738" y="532" width="24" height="24" rx="12" fill="#F8FAFC" stroke="#0EA5E9" stroke-width="4"/>
    <text x="1044" y="550" fill="#0F172A" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18" font-weight="700">5 minutes</text>

    <text x="500" y="608" fill="#475569" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18">Random Order</text>
    <rect x="1090" y="586" width="82" height="36" rx="18" fill="#0EA5E9"/>
    <circle cx="1152" cy="604" r="14" fill="#FFFFFF"/>

    <text x="500" y="660" fill="#475569" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="18">Pause Slideshow</text>
    <rect x="1090" y="638" width="82" height="36" rx="18" fill="#CBD5E1"/>
    <circle cx="1110" cy="656" r="14" fill="#FFFFFF"/>
  </g>
</svg>
